  <g fill="none" stroke="#718f9b" stroke-width="1.5">
    <path d="M620 222H793L827 191H1110"/><path d="M542 432H790L827 403H1110"/>
    <path d="M634 576H791L827 564H1110"/><path d="M207 695H701M207 684V706M701 684V706"/>
  </g>
  <g fill="#dfebe9" font-family="Barlow,Segoe UI,sans-serif" font-size="19">
    <text x="827" y="175">Ceramic ribs</text><text x="827" y="219" font-size="15" fill="#9aacb5">Solid, scarred, individually lit</text>
    <text x="827" y="386">Dormant basalt core</text><text x="827" y="431" font-size="15" fill="#9aacb5">Mechanical joints, quiet signal</text>
    <text x="827" y="547">Offset apertures</text><text x="827" y="592" font-size="15" fill="#9aacb5">Flyable gaps; no invisible disk</text>
    <text x="400" y="728" font-size="16">480 m outer span</text>
